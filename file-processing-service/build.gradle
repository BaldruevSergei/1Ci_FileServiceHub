plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) // Используем Java 17
    }
}

repositories {
    mavenCentral() // Репозиторий Maven Central
}

dependencies {
    // Основные зависимости Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Swagger и OpenAPI для документации
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'

    // Зависимости для тестирования
    testImplementation 'org.springframework.boot:spring-boot-starter-test' // JUnit и Spring Boot Test
    testImplementation 'org.mockito:mockito-core:5.5.0' // Mockito для модульного тестирования
    testImplementation 'org.assertj:assertj-core:3.24.2' // AssertJ для проверки
}

tasks.named('test') {
    useJUnitPlatform() // Используем JUnit Platform для тестов
}

tasks.withType(Test) {
    testLogging {
        events "PASSED", "FAILED", "SKIPPED" // Логирование результатов тестов
    }
}
